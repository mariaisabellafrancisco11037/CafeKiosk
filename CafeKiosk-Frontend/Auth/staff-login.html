<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    CafeKiosk - Staff Login
  </title>

  <link
    rel="stylesheet"
    href="../Assets/css/login.css"
  >
</head>

<body
  class="auth-body"
  data-role="Staff"
>

  <main class="login-page">

    <section class="login-card">

      <a
        href="../Auth/login.html"
        class="back-link"
        aria-label="Back to login selection"
      >
        ←
      </a>

      <img
        src="../Assets/images/logo.png"
        alt="CafeKiosk Logo"
        class="auth-logo"
      >

      <h1>
        Welcome Back
      </h1>

      <div class="role-title">
        Staff Login
      </div>

      <form
        class="login-form"
        autocomplete="on"
      >

        <label for="staffUserId">
          User ID
        </label>

        <div class="line-input-wrap">

          <input
            id="staffUserId"
            name="userId"
            type="text"
            placeholder="Enter your User ID"
            autocomplete="username"
            maxlength="80"
            required
          >

        </div>


        <label for="staffPassword">
          Password
        </label>

        <div class="line-input-wrap password-line">

          <input
            id="staffPassword"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            maxlength="128"
            required
          >

          <button
            type="button"
            class="show-password"
            data-password-target="staffPassword"
            aria-label="Show password"
            title="Show password"
          >
            ◉
          </button>

        </div>


        <div
          id="staffLoginMessage"
          class="login-message"
          role="status"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          class="login-button"
        >
          LOG IN
        </button>


        <button
          type="button"
          class="forgot-button"
          data-forgot
        >
          Forgot Password?
        </button>


        <p class="login-hint">
          Sign in using your authorized CafeKiosk staff account.
        </p>

      </form>

    </section>

  </main>


  <div
    id="forgotModal"
    class="forgot-overlay"
    aria-hidden="true"
  >

    <section
      class="forgot-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="forgotTitle"
    >

      <button
        id="closeForgot"
        type="button"
        class="forgot-close"
        aria-label="Close"
      >
        ×
      </button>


      <h2 id="forgotTitle">
        Forgot Password
      </h2>


      <p>
        Please contact your CafeKiosk administrator or system manager
        to reset your staff account password.
      </p>


      <button
        id="forgotOk"
        type="button"
        class="modal-ok"
      >
        OK
      </button>

    </section>

  </div>


  <script src="../Assets/js/login.js"></script>

</body>
</html>
